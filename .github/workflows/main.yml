name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  # =========================================================
  # 1. TRABAJO DE VERIFICACIÓN (CALIDAD Y PRUEBAS)
  # =========================================================
  lint_and_test:
    name: Lint & Test (QA)
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      # 1. pnpm debe configurarse ANTES de Node para que la caché funcione correctamente
      - name: Configurar pnpm
        uses: pnpm/action-setup@v4 # Actualizado a v4
        with:
          version: 8

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          # 2. Especificamos la ruta de ambos lockfiles para una caché eficiente
          cache-dependency-path: |
            backend/pnpm-lock.yaml
            frontend/pnpm-lock.yaml

      # --- ETAPA BACKEND ---
      - name: Instalar Dependencias del Backend
        working-directory: backend
        run: pnpm install

      - name: Ejecutar Linter (Backend)
        working-directory: backend
        run: pnpm run lint

      - name: Ejecutar Pruebas Unitarias (Backend)
        working-directory: backend
        run: pnpm test

      # --- ETAPA FRONTEND ---
      - name: Instalar Dependencias del Frontend
        working-directory: frontend
        run: pnpm install

      - name: Ejecutar Linter (Frontend)
        working-directory: frontend
        run: pnpm run lint

      - name: Ejecutar Pruebas de Componentes (Frontend)
        working-directory: frontend
        run: pnpm test

  # =========================================================
  # 2. TRABAJO DE COMPILACIÓN Y DESPLIEGUE (DOCKER)
  # =========================================================
  build_and_push:
    name: Build & Push Docker Images
    needs: lint_and_test
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v3 # Actualizado a la versión más reciente
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Construir y Subir Imagen del Backend
        uses: docker/build-push-action@v5 # Actualizado para evitar warnings de deprecación
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/demon-threshold-backend:latest

      - name: Construir y Subir Imagen del Frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/demon-threshold:latest