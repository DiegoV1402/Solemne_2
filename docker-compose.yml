version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: mongodb_service
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    container_name: backend_service
    ports:
      - "3000:3000" # Ajusta si tu backend expone otro puerto
    environment:
      - MONGO_URI=mongodb://mongodb:27017/mi_base_de_datos
    depends_on:
      - mongodb

  frontend:
    build: ./frontend
    container_name: frontend_service
    ports:
      - "80:80" # Ajusta si tu frontend expone otro puerto
    depends_on:
      - backend

volumes:
  mongo_data: