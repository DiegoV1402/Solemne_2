name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22 # <-- CORRECCIÓN 1: Actualizado a Node 22 para quitar la advertencia

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install dependencies
        working-directory: frontend # <-- CORRECCIÓN 2: Cambia 'demon-threshold' por el nombre real de tu carpeta (ej. 'frontend')
        run: pnpm install

      - name: Build with Vite
        working-directory: frontend # <-- CORRECCIÓN 2: Aquí también
        run: pnpm build